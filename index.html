<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SidePot - Self- Employed Planner for Tax & Retirement</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="index.css" />

  </head>
  <body>
    <!-- Use header, main, and footer elements to give semantic structure -->
    <header>
      <h1>SidePot<sup>&reg;</sup></h1>

      <!-- Navigation elements -->
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="planner.html">Planner</a></li>
          <li><a href="contributions.html">Contributions</a></li>
        </ul>
      </nav>

      <!-- Since we don't have the ability to style we use old style HTML to give some visual formatting -->
      <hr />
    </header>

    <main>
      <img src="images/hero-tax-planner.jpg" alt="Illustration of a self-employed worker setting aside money for taxes and retirement" width="300" />

      <section id="platform-overview">
        <div class="card">What you can do: Pick Solo 401(k)/SEP IRA/Roth IRA, estimate taxes, track set-asides</div>
        <div class="card">Live savings ticker (WebSocket): <span id="savings-ticker">Someone just set aside $250 for Q3 taxes</span></div>
      </section>

      <h1>Welcome to SidePot<sup>&reg;</sup></h1>
      <!-- Placeholder for login: after login the user's email is displayed and the service authenticates -->
      <form method="get" action="dashboard.html">
        <div>
          <span>@</span>
          <label for="email" hidden>Email</label>
          <input type="text" id="email" placeholder="your@email.com" />
        </div>
        <div>
          <span>🔒</span>
          <label for="password" hidden>Password</label>
          <input type="password" id="password" placeholder="password" />
        </div>
        <button type="submit">Login</button>
        <button type="submit">Create</button>
      </form>

    <footer>
      <hr />
      <span class="text-reset">By the pen of Abe Farghali</span>
      <br />
      <a href="https://github.com/3bdo9029/simon-html/">GitHub</a>
    </footer>
  </body>
</html>
